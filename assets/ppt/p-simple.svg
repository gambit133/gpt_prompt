<svg xmlns="http://www.w3.org/2000/svg" width="533" height="753" viewBox="0 0 533 753"><rect width="533" height="753" fill="#EFE7D9"/><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3b2a1e" flood-opacity=".22"/></filter></defs><g transform="translate(18,16)" filter="url(#sh)"><rect width="240" height="135" rx="7" fill="#FFFFFF"/><rect x="0" y="0" width="7" height="135" fill="#F97316"/><text x="22" y="62" font-size="17" font-weight="800" fill="#111111" text-anchor="start" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">물의 상태 변화</text><rect x="22" y="70" width="40" height="3" fill="#F97316"/><text x="22" y="88" font-size="8.5" font-weight="500" fill="rgba(0,0,0,.55)" text-anchor="start" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">중1 과학 · 쉽고 간결한 버전</text><text x="22" y="118" font-size="7" font-weight="600" fill="rgba(0,0,0,.55)" text-anchor="start" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">8장 · 한 장에 한 문장</text><text x="232" y="130" font-size="6" fill="rgba(0,0,0,.55)" text-anchor="end" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">1</text></g><g transform="translate(275,16)" filter="url(#sh)"><rect width="240" height="135" rx="7" fill="#FFFFFF"/><text x="14" y="20" font-size="8" font-weight="600" fill="rgba(0,0,0,.55)" text-anchor="start" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">오늘 배울 것</text><text x="120.0" y="66" font-size="15" font-weight="800" fill="#111111" text-anchor="middle" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">물은 온도에 따라 모습이 바뀐다</text><rect x="104.0" y="76" width="32" height="3" fill="#F97316"/><text x="120.0" y="104" font-size="9" font-weight="700" fill="#F97316" text-anchor="middle" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">고체 · 액체 · 기체</text><text x="232" y="130" font-size="6" fill="rgba(0,0,0,.55)" text-anchor="end" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">2</text></g><g transform="translate(18,167)" filter="url(#sh)"><rect width="240" height="135" rx="7" fill="#FFFFFF"/><text x="14" y="20" font-size="11" font-weight="800" fill="#111111" text-anchor="start" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">상태 변화 한눈에</text><rect x="14" y="25" width="212" height="1.2" fill="#F97316"/><rect x="14.0" y="52" width="62.666666666666664" height="34" rx="6" fill="#F97316" stroke="#F97316" stroke-width="1"/><text x="45.33333333333333" y="72.0" font-size="8" font-weight="800" fill="#fff" text-anchor="middle" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">얼음</text><path d="M77.66666666666666,69.0 l9,0 m-3,-3 l3,3 l-3,3" stroke="#F97316" stroke-width="1.6" fill="none"/><rect x="88.66666666666666" y="52" width="62.666666666666664" height="34" rx="6" fill="#FFF4EC" stroke="#F97316" stroke-width="1"/><text x="119.99999999999999" y="72.0" font-size="8" font-weight="800" fill="#111111" text-anchor="middle" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">물</text><path d="M152.33333333333331,69.0 l9,0 m-3,-3 l3,3 l-3,3" stroke="#F97316" stroke-width="1.6" fill="none"/><rect x="163.33333333333331" y="52" width="62.666666666666664" height="34" rx="6" fill="#FFF4EC" stroke="#F97316" stroke-width="1"/><text x="194.66666666666666" y="72.0" font-size="8" font-weight="800" fill="#111111" text-anchor="middle" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">수증기</text><text x="45.33333333333333" y="100" font-size="6.8" font-weight="500" fill="rgba(0,0,0,.55)" text-anchor="middle" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">융해 →</text><text x="119.99999999999999" y="100" font-size="6.8" font-weight="500" fill="rgba(0,0,0,.55)" text-anchor="middle" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">기화 →</text><text x="194.66666666666666" y="100" font-size="6.8" font-weight="500" fill="rgba(0,0,0,.55)" text-anchor="middle" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif"></text><rect x="14" y="112" width="212" height="12" rx="3" fill="#FFF4EC"/><text x="120.0" y="120.5" font-size="6.5" font-weight="600" fill="rgba(0,0,0,.55)" text-anchor="middle" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">읽는 순서: 왼쪽 → 오른쪽</text><text x="232" y="130" font-size="6" fill="rgba(0,0,0,.55)" text-anchor="end" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">3</text></g><g transform="translate(275,167)" filter="url(#sh)"><rect width="240" height="135" rx="7" fill="#FFFFFF"/><text x="14" y="20" font-size="8" font-weight="600" fill="rgba(0,0,0,.55)" text-anchor="start" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">핵심 2</text><text x="120.0" y="66" font-size="15" font-weight="800" fill="#111111" text-anchor="middle" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">끓는 동안 온도는 그대로 100℃</text><rect x="104.0" y="76" width="32" height="3" fill="#F97316"/><text x="120.0" y="104" font-size="9" font-weight="700" fill="#F97316" text-anchor="middle" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">끓는점 · 일정</text><text x="232" y="130" font-size="6" fill="rgba(0,0,0,.55)" text-anchor="end" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">4</text></g><g transform="translate(18,318)" filter="url(#sh)"><rect width="240" height="135" rx="7" fill="#FFFFFF"/><text x="14" y="20" font-size="11" font-weight="800" fill="#111111" text-anchor="start" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">용어 한 장 표</text><rect x="14" y="25" width="212" height="1.2" fill="#F97316"/><rect x="14" y="34" width="212" height="18" fill="#F97316"/><text x="20.0" y="46.5" font-size="8" font-weight="