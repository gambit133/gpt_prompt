ont-weight="500" fill="#111111" text-anchor="start" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">승화</text><text x="232" y="130" font-size="6" fill="rgba(0,0,0,.55)" text-anchor="end" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">5</text></g><g transform="translate(275,318)" filter="url(#sh)"><rect width="240" height="135" rx="7" fill="#FFFFFF"/><text x="14" y="20" font-size="11" font-weight="800" fill="#111111" text-anchor="start" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">확인 질문 1개</text><rect x="14" y="25" width="212" height="1.2" fill="#F97316"/><rect x="14" y="34" width="212" height="24" rx="5" fill="#FFF4EC"/><text x="22" y="50" font-size="9" font-weight="800" fill="#111111" text-anchor="start" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">Q. 얼음이 물이 되는 변화는?</text><circle cx="24" cy="73" r="5" fill="#F97316" stroke="#F97316" stroke-width="1"/><text x="24" y="75.5" font-size="6.5" font-weight="800" fill="#fff" text-anchor="middle" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">①</text><text x="34" y="76" font-size="8" font-weight="700" fill="#111111" text-anchor="start" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">융해</text><circle cx="24" cy="88" r="5" fill="none" stroke="#F97316" stroke-width="1"/><text x="24" y="90.5" font-size="6.5" font-weight="800" fill="#F97316" text-anchor="middle" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">②</text><text x="34" y="91" font-size="8" font-weight="500" fill="#111111" text-anchor="start" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">응고</text><circle cx="24" cy="103" r="5" fill="none" stroke="#F97316" stroke-width="1"/><text x="24" y="105.5" font-size="6.5" font-weight="800" fill="#F97316" text-anchor="middle" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">③</text><text x="34" y="106" font-size="8" font-weight="500" fill="#111111" text-anchor="start" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">기화</text><circle cx="24" cy="118" r="5" fill="none" stroke="#F97316" stroke-width="1"/><text x="24" y="120.5" font-size="6.5" font-weight="800" fill="#F97316" text-anchor="middle" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">④</text><text x="34" y="121" font-size="8" font-weight="500" fill="#111111" text-anchor="start" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">승화</text><text x="232" y="130" font-size="6" fill="rgba(0,0,0,.55)" text-anchor="end" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">6</text></g><rect x="18" y="475" width="497" height="262" rx="10" fill="#fff" opacity=".55"/><text x="266.5" y="505" text-anchor="middle" font-size="13" font-weight="800" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">8장 이내 · 한 장에 큰 문장 하나 + 핵심 단어</text><text x="266.5" y="527" text-anchor="middle" font-size="9.5" fill="#6b5a4a" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">긴 설명은 모두 발표자 노트로. 글꼴 36 이상, 글자 40자 이내</text><text x="266.5" y="544" text-anchor="middle" font-size="9.5" fill="#6b5a4a" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">도식·표는 꼭 필요한 것만 크게 하나씩</text></svg>