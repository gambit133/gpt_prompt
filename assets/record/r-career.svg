<svg xmlns="http://www.w3.org/2000/svg" width="533" height="753" viewBox="0 0 533 753"><rect width="533" height="753" fill="#EFE7D9"/><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3b2a1e" flood-opacity=".2"/></filter></defs><g filter="url(#sh)"><rect x="36" y="36" width="461" height="681" rx="12" fill="#fffdf8"/></g><rect x="36" y="36" width="461" height="54" rx="12" fill="#3b2a1e"/><rect x="36" y="78" width="461" height="12" fill="#3b2a1e"/><text x="58" y="69" font-size="15" font-weight="800" fill="#fff" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">창의적 체험활동 · 진로활동</text><text x="475" y="69" text-anchor="end" font-size="11" fill="#fdeccc" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">최대 500자 · 1,500 Byte</text><text x="60" y="128" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">진로 탐색 활동에서 데이터 분석 분야에</text><text x="60" y="152" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">관심을 갖고 관련 직업의 역할과 필요한</text><text x="60" y="176" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">역량을 조사함. 교내 진로 특강 후 공공</text><text x="60" y="200" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">데이터를 활용해 학교 급식 만족도를 분석하는</text><text x="60" y="224" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">작은 프로젝트를 스스로 수행하고 결과를</text><text x="60" y="248" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">학급에 공유함. 진로 상담에서 자신의 강점을</text><text x="60" y="272" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">끈기 있게 자료를 정리하는 힘으로 표현하며</text><text x="60" y="296" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">구체적인 학습 계획을 세우는 등 진로 의식이</text><text x="60" y="320" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">뚜렷해짐.</text><rect x="60" y="633" width="413" height="8" rx="4" fill="#ead9c2"/><rect x="60" y="633" width="159" height="8" rx="4" fill="#3e8e5a"/><text x="60" y="661" font-size="12.5" font-weight="700" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">193자 · 475 Byte</text><text x="473" y="661" text-anchor="end" font-size="12" fill="#8b7a6a" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">명사형 종결 ✓ · 금지 표현 없음 ✓</text><text x="266.5" y="693" text-anchor="middle" font-size="11" fill="#8b7a6a" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">※ 가상의 예시 문구입니다. 실제 관찰 사실을 바탕으로 교사가 직접 작성·수정해 입력하세요.</text></svg>