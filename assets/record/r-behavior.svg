<svg xmlns="http://www.w3.org/2000/svg" width="533" height="753" viewBox="0 0 533 753"><rect width="533" height="753" fill="#EFE7D9"/><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3b2a1e" flood-opacity=".2"/></filter></defs><g filter="url(#sh)"><rect x="36" y="36" width="461" height="681" rx="12" fill="#fffdf8"/></g><rect x="36" y="36" width="461" height="54" rx="12" fill="#3b2a1e"/><rect x="36" y="78" width="461" height="12" fill="#3b2a1e"/><text x="58" y="69" font-size="15" font-weight="800" fill="#fff" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">행동특성 및 종합의견</text><text x="475" y="69" text-anchor="end" font-size="11" fill="#fdeccc" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">최대 300자 · 900 Byte</text><text x="60" y="128" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">책임감이 강하여 맡은 역할을 끝까지</text><text x="60" y="152" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">수행하며, 급우의 어려움을 먼저 살피는</text><text x="60" y="176" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">배려심을 보임. 학습 면에서는 질문을 통해</text><text x="60" y="200" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">이해를 확인하는 습관이 있고, 모둠 활동에서</text><text x="60" y="224" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">의견을 조율하는 역할을 자주 맡음. 1학기</text><text x="60" y="248" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">소극적이던 발표 태도가 2학기에는 자발적으로</text><text x="60" y="272" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">손을 드는 모습으로 변화하는 등 성장이</text><text x="60" y="296" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">뚜렷함.</text><rect x="60" y="633" width="413" height="8" rx="4" fill="#ead9c2"/><rect x="60" y="633" width="229" height="8" rx="4" fill="#3e8e5a"/><text x="60" y="661" font-size="12.5" font-weight="700" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">166자 · 406 Byte</text><text x="473" y="661" text-anchor="end" font-size="12" fill="#8b7a6a" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">명사형 종결 ✓ · 금지 표현 없음 ✓</text><text x="266.5" y="693" text-anchor="middle" font-size="11" fill="#8b7a6a" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">※ 가상의 예시 문구입니다. 실제 관찰 사실을 바탕으로 교사가 직접 작성·수정해 입력하세요.</text></svg>