<svg xmlns="http://www.w3.org/2000/svg" width="533" height="753" viewBox="0 0 533 753"><rect width="533" height="753" fill="#EFE7D9"/><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3b2a1e" flood-opacity=".2"/></filter></defs><g filter="url(#sh)"><rect x="36" y="36" width="461" height="681" rx="12" fill="#fffdf8"/></g><rect x="36" y="36" width="461" height="54" rx="12" fill="#3b2a1e"/><rect x="36" y="78" width="461" height="12" fill="#3b2a1e"/><text x="58" y="69" font-size="15" font-weight="800" fill="#fff" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">세부능력 및 특기사항 · 국어</text><text x="475" y="69" text-anchor="end" font-size="11" fill="#fdeccc" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">최대 500자 · 1,500 Byte</text><text x="60" y="128" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">「구운몽」을 읽고 환몽 구조가 주제를</text><text x="60" y="152" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">드러내는 방식에 관심을 가져 현실과 꿈의</text><text x="60" y="176" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">대응 관계를 표로 정리하고, 성진과 양소유의</text><text x="60" y="200" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">심리 변화를 장면별로 추적하여 발표함. 발표</text><text x="60" y="224" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">과정에서 부귀공명의 덧없음이라는 주제를 당대</text><text x="60" y="248" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">사대부의 가치관과 연결하여 설명하였고,</text><text x="60" y="272" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">친구들의 질문에 작품 속 근거를 들어 차분히</text><text x="60" y="296" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">답변함. 이후 비슷한 구조의 고전 소설을</text><text x="60" y="320" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">스스로 찾아 비교 보고서를 작성하는 등</text><text x="60" y="344" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">작품을 깊이 읽는 태도가 돋보임.</text><rect x="60" y="633" width="413" height="8" rx="4" fill="#ead9c2"/><rect x="60" y="633" width="189" height="8" rx="4" fill="#3e8e5a"/><text x="60" y="661" font-size="12.5" font-weight="700" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">229자 · 567 Byte</text><text x="473" y="661" text-anchor="end" font-size="12" fill="#8b7a6a" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">명사형 종결 ✓ · 금지 표현 없음 ✓</text><text x="266.5" y="693" text-anchor="middle" font-size="11" fill="#8b7a6a" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">※ 가상의 예시 문구입니다. 실제 관찰 사실을 바탕으로 교사가 직접 작성·수정해 입력하세요.</text></svg>