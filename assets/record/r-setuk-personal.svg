<svg xmlns="http://www.w3.org/2000/svg" width="533" height="753" viewBox="0 0 533 753"><rect width="533" height="753" fill="#EFE7D9"/><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3b2a1e" flood-opacity=".2"/></filter></defs><g filter="url(#sh)"><rect x="36" y="36" width="461" height="681" rx="12" fill="#fffdf8"/></g><rect x="36" y="36" width="461" height="54" rx="12" fill="#3b2a1e"/><rect x="36" y="78" width="461" height="12" fill="#3b2a1e"/><text x="58" y="69" font-size="15" font-weight="800" fill="#fff" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">개인별 세부능력 및 특기사항</text><text x="475" y="69" text-anchor="end" font-size="11" fill="#fdeccc" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">최대 500자 · 1,500 Byte</text><text x="60" y="128" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">학교 교육과정으로 운영된 융합 프로젝트에서</text><text x="60" y="152" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">지역 하천 수질을 주제로 선정하여 과학·사회</text><text x="60" y="176" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">교과 지식을 연결함. 수질 측정 자료를</text><text x="60" y="200" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">정리하고 주민 설문 결과와 비교하여 원인을</text><text x="60" y="224" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">분석하였으며, 결과를 교내 발표회에서</text><text x="60" y="248" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">공유함. 자료 수집 과정에서 어려움이 있을</text><text x="60" y="272" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">때 교사와 상의하여 방법을 조정하는 등</text><text x="60" y="296" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">문제를 해결해 가는 과정이 성실함.</text><rect x="60" y="633" width="413" height="8" rx="4" fill="#ead9c2"/><rect x="60" y="633" width="150" height="8" rx="4" fill="#3e8e5a"/><text x="60" y="661" font-size="12.5" font-weight="700" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">181자 · 449 Byte</text><text x="473" y="661" text-anchor="end" font-size="12" fill="#8b7a6a" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">명사형 종결 ✓ · 금지 표현 없음 ✓</text><text x="266.5" y="693" text-anchor="middle" font-size="11" fill="#8b7a6a" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">※ 가상의 예시 문구입니다. 실제 관찰 사실을 바탕으로 교사가 직접 작성·수정해 입력하세요.</text></svg>