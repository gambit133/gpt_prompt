<svg xmlns="http://www.w3.org/2000/svg" width="533" height="753" viewBox="0 0 533 753"><rect width="533" height="753" fill="#EFE7D9"/><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3b2a1e" flood-opacity=".2"/></filter></defs><g filter="url(#sh)"><rect x="36" y="36" width="461" height="681" rx="12" fill="#fffdf8"/></g><rect x="36" y="36" width="461" height="54" rx="12" fill="#3b2a1e"/><rect x="36" y="78" width="461" height="12" fill="#3b2a1e"/><text x="58" y="69" font-size="15" font-weight="800" fill="#fff" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">창의적 체험활동 · 동아리활동</text><text x="475" y="69" text-anchor="end" font-size="11" fill="#fdeccc" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">최대 500자 · 1,500 Byte</text><text x="60" y="128" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">과학탐구 동아리에서 자유 낙하와 공기 저항을</text><text x="60" y="152" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">주제로 모둠 탐구를 진행함. 실험 장치를</text><text x="60" y="176" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">직접 제작하고 촬영 영상을 분석하여 낙하</text><text x="60" y="200" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">시간을 측정하였으며, 결과를 그래프로</text><text x="60" y="224" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">정리하여 동아리 발표회에서 발표함. 후배</text><text x="60" y="248" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">부원에게 측정 방법을 설명하고 역할을 나누는</text><text x="60" y="272" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">과정에서 협업 능력을 보였고, 발표 후 받은</text><text x="60" y="296" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">질문을 반영하여 보고서를 수정하는 성실함을</text><text x="60" y="320" font-size="14.5" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif" xml:space="preserve">보임.</text><rect x="60" y="633" width="413" height="8" rx="4" fill="#ead9c2"/><rect x="60" y="633" width="159" height="8" rx="4" fill="#3e8e5a"/><text x="60" y="661" font-size="12.5" font-weight="700" fill="#3b2a1e" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">192자 · 476 Byte</text><text x="473" y="661" text-anchor="end" font-size="12" fill="#8b7a6a" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">명사형 종결 ✓ · 금지 표현 없음 ✓</text><text x="266.5" y="693" text-anchor="middle" font-size="11" fill="#8b7a6a" font-family="'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif">※ 가상의 예시 문구입니다. 실제 관찰 사실을 바탕으로 교사가 직접 작성·수정해 입력하세요.</text></svg>