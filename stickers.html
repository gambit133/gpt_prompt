<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쌤플레이 · PPT 치트키</title>
<meta name="description" content="바로 복붙 가능한 PPT 치트키 모음집! 투명 배경 캐릭터·아이콘·캘리그라피·버튼을 끌어서 배치하고 한 번에 복사하세요.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--paper:#fbf6ec;--card:#fffdf8;--ink:#3b2a1e;--muted:#6e5b49;--line:#ead9c2;--line2:#cdb48c;--accent:#f0962a;--accent2:#ffbb45;--accent-dark:#c2721a;--accent-text:#7a4712;--on-accent:#2e2016;--ring:rgba(240,150,42,.3);--soft:#fdeccc;--soft2:#fbf2e0;--sel:#2f7de1}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1440px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;gap:12px;padding:14px 0 6px}
header .logo{height:48px;display:block}
.topnav{display:flex;gap:4px;margin-left:auto}
.topnav a{font-size:16px;font-weight:800;color:var(--muted);text-decoration:none;padding:9px 16px;border-radius:999px}
.topnav a:hover{color:var(--ink);background:var(--soft2)}
.topnav a.on{color:var(--ink);background:var(--soft)}
.menu{position:relative;flex:none}
.hamb{width:36px;height:36px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;padding:0;cursor:pointer}
.hamb:hover,.hamb.open{background:var(--soft2)}
.hamb .hb{display:flex;gap:4px}.hamb .hb i{width:4px;height:4px;border-radius:50%;background:var(--ink)}
.menulist{position:absolute;right:0;top:calc(100% + 10px);background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:0 18px 34px -16px rgba(0,0,0,.4);padding:4px;min-width:140px;z-index:60;display:grid}
.menulist[hidden]{display:none}
.menulist a{text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:600;padding:7px 10px;border-radius:7px}
.menulist .msep{border:0;border-top:1px solid var(--line);margin:4px 6px}
.menulist a:hover{background:var(--soft2);color:var(--accent-text)}
.hero{margin:6px 0 14px}
.hero h1{margin:0;font-size:26px;letter-spacing:-.03em}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--accent2) 62%)}
.steps{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0;padding:0}
.steps li{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 5px}
.steps b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
.side{position:sticky;top:12px;padding:2px}
.side h2{font-size:12px;color:var(--muted);margin:2px 2px 8px}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.packs h3.sec{grid-column:1/-1;margin:10px 2px 0;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em}
.pack{position:relative;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:7px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);transition:transform .15s,box-shadow .15s,border-color .15s}
.pack:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 10px 20px -14px rgba(59,42,30,.45)}
.pack.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);background:#fff}
.pack .pv{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-bottom:5px}
.pack .pv img{width:100%;aspect-ratio:1;object-fit:contain}
.pack b{font-size:12.5px;gap:4px;display:flex;justify-content:space-between;align-items:center}
.pack b span{font-size:11px;font-weight:700;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 8px}
.pack small{display:none}
.pack b>:first-child,.pack b{min-width:0}
.pack .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.peek{position:fixed;z-index:80;width:360px;background:#fff;border:1.5px solid var(--line2);border-radius:16px;box-shadow:0 24px 40px -18px rgba(59,42,30,.5);padding:12px;display:none;pointer-events:none}
.peek.show{display:block}
.peek b{display:block;font-size:13px;margin-bottom:8px}
.peek .g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background-color:#fff;background-image:linear-gradient(45deg,#f2f2f2 25%,transparent 25%),linear-gradient(-45deg,#f2f2f2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#f2f2f2 75%),linear-gradient(-45deg,transparent 75%,#f2f2f2 75%);background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0;border-radius:10px;padding:6px}
.peek .g img{width:100%;aspect-ratio:1;object-fit:contain}
.main{min-width:0}
.toolbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 10px 11px;margin-bottom:10px;background:rgba(255,253,248,.94);backdrop-filter:blur(6px);border:1.5px solid var(--line);border-radius:16px}
.toolbar .sp{flex:1}
.selinfo{font-size:12.5px;color:var(--muted);font-weight:700}
.selinfo.on{color:var(--sel)}
.grp{display:flex;gap:6px;align-items:center}
.gbtn{border:0;background:transparent;font-family:inherit;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;color:var(--muted);padding:7px 9px;border-radius:9px;cursor:pointer}
.gbtn:hover{background:var(--soft2);color:var(--ink)}
.btn{position:relative;border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:8px 13px;font-family:inherit;font-weight:800;font-size:13px;color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center;box-shadow:0 4px 0 var(--ink);transform:translateY(-2px);transition:transform .08s,box-shadow .08s,background .15s}
.btn:hover{background:var(--soft2)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:0 2px 0 var(--ink)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;user-select:none}
.chk input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0}
.chk input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.chk input:checked{background:var(--accent)}.chk input:checked::after{left:16px}
.bgsw{display:inline-flex;gap:2px;padding:3px;border:1px solid #ddd5c9;border-radius:999px;background:#fff}
.bgsw button{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;border-radius:999px;padding:4px 10px 4px 5px;font-family:inherit;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer;width:auto;height:auto}
.bgsw button.on{background:var(--ink);color:#fff;outline:0}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid #ccc}
.sw-check{background:conic-gradient(#ccc 25%,#fff 0 50%,#ccc 0 75%,#fff 0) 0 0/8px 8px}.sw-white{background:#fff}.sw-dark{background:#2b2b2b;border-color:#2b2b2b}
.board{position:relative;isolation:isolate;border:1.5px solid var(--line);border-radius:18px;min-height:460px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;margin-bottom:10px}
.board.bg-check,.bgstage.bg-check{background-color:#fff;background-image:linear-gradient(45deg,#eee 25%,transparent 25%),linear-gradient(-45deg,#eee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eee 75%),linear-gradient(-45deg,transparent 75%,#eee 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.board.bg-white,.bgstage.bg-white{background:#fff}.board.bg-dark,.bgstage.bg-dark{background:#2b2b2b}
.item{position:absolute;cursor:grab;touch-action:none;border-radius:10px;outline:2px solid transparent;outline-offset:3px;transition:outline-color .12s}
.item img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none;transition:transform .12s}
.item:hover{outline-color:rgba(47,125,225,.35)}
.item:hover img{transform:scale(1.04)}
.item.sel{outline-color:var(--sel);background:rgba(47,125,225,.07)}
.item.dragging{cursor:grabbing}
.item .lbin{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);z-index:5;width:max(140px,100%);font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);background:#fff;border:1.5px solid var(--accent);border-radius:8px;padding:4px 8px;outline:none;box-shadow:0 0 0 3px var(--ring,rgba(232,150,40,.25))}
.item .lb{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none;background:rgba(255,253,248,.95);padding:1px 6px;border-radius:6px}
.item:hover .lb{opacity:1}
.minepanel{margin-bottom:10px}
.minepanel[hidden]{display:none}
.mrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mrow .sp{flex:1}
.tol{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.tol input{width:90px;accent-color:var(--accent)}
.mhint{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.55}
.mhint b{color:var(--ink)}.mhint .warn{color:#c0392b;font-weight:700}
.board.drop{outline:3px dashed var(--accent);outline-offset:-8px}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:14px;line-height:1.7;padding:20px;pointer-events:none}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}
.pack.mine{border-style:dashed}
.pack .pv .plus{display:grid;place-items:center;aspect-ratio:1;border-radius:8px;background:var(--soft2);color:var(--accent-text);font-weight:800;font-size:18px}
.btn.mineonly,.btn.notmine{display:none}
body.inmine .btn.mineonly,body:not(.inmine) .btn.notmine{display:inline-flex}
.dropzone{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:2px dashed var(--line2);border-radius:14px;padding:10px;background:var(--soft2);transition:border-color .15s,background .15s}
.dropzone.drop{border-color:var(--accent);background:#fff4e2}
.dz{display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px 10px 4px 4px;border-radius:12px;flex:1;min-width:200px}
.dz:hover{background:#fff}
.dzi{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);font-size:24px;font-weight:800;box-shadow:0 3px 0 var(--ink)}
.dz b{display:block;font-size:14px}.dz small{display:block;font-size:12px;color:var(--muted)}
.dzopt{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.tol output{min-width:22px;font-size:12px;color:var(--ink)}
.backup{border:1.5px solid var(--line);border-radius:14px;padding:10px;background:#fff;display:grid;gap:6px;align-content:start}
.bkhead{display:flex;gap:8px;align-items:center;font-size:13px}.bkhead span{font-size:12px;color:var(--muted)}.bkhead .warn{color:#c0392b;font-weight:700}
.bkbtns{display:flex;gap:6px}.backup small{font-size:11.5px;color:var(--muted)}
.btn.sm{padding:6px 11px;font-size:12.5px;box-shadow:0 3px 0 var(--ink)}
.editor{border:1.5px solid #d9d2c7;border-radius:18px;overflow:hidden;background:#ece7df;margin-bottom:10px;box-shadow:0 18px 34px -26px rgba(59,42,30,.5)}
.edhead{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#f7f3ec;border-bottom:1px solid #ddd5c9;font-size:13px}
.edcount{font-size:11.5px;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.edhead .sp{flex:1}.edhint{font-size:11.5px;color:var(--muted)}
.editor .board{border:0;border-radius:0;margin:0}
.item .hd{display:none;position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--sel);border-radius:3px;z-index:3;touch-action:none}
.item.sel .hd{display:block}
.hd.nw{left:-9px;top:-9px;cursor:nwse-resize}.hd.ne{right:-9px;top:-9px;cursor:nesw-resize}.hd.sw{left:-9px;bottom:-9px;cursor:nesw-resize}.hd.se{right:-9px;bottom:-9px;cursor:nwse-resize}
.ctx{position:absolute;z-index:9000;display:flex;align-items:center;gap:2px;background:#2b2b2b;border-radius:10px;padding:4px;box-shadow:0 10px 22px -10px rgba(0,0,0,.6);white-space:nowrap}
.ctx[hidden]{display:none}
.ctx button{border:0;background:transparent;color:#fff;font-family:inherit;font-weight:700;font-size:12px;padding:6px 9px;border-radius:7px;cursor:pointer}
.ctx button:hover{background:rgba(255,255,255,.14)}
.ctx i{width:1px;height:16px;background:rgba(255,255,255,.25);margin:0 2px}
.board.busy .ctx{display:none}
.ctx .mineonly,.ctx .notmine{display:none}
body.inmine .ctx .mineonly,body:not(.inmine) .ctx .notmine{display:inline-block}
.minepanel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:stretch}
.morebtn{display:none}.more{display:contents}
.mbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border:1.5px dashed var(--line2);border-radius:14px;padding:7px 10px;background:var(--soft2)}
.bkcard{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:14px;padding:7px 8px 7px 14px;background:var(--card)}
.bkt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.bkt span{font-size:11px;font-weight:700;color:var(--muted)}
.bkt b{font-size:12.5px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.bkt b.warn{color:#c2410c}
.bkb{display:flex;gap:6px}
.obtn{display:inline-flex;align-items:center;gap:5px;font-family:inherit;font-weight:800;font-size:13px;color:var(--ink);background:var(--soft2);border:1.5px solid var(--line2);border-radius:10px;padding:7px 11px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.obtn:hover{background:#fff4e2;border-color:var(--accent)}
.obtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.marquee{position:absolute;border:1.5px dashed var(--sel);background:rgba(47,125,225,.1);pointer-events:none;display:none;z-index:30}
.tip{margin:2px 4px 24px;font-size:12.5px;color:var(--muted)}
.bgm{position:fixed;inset:0;z-index:9500;background:rgba(30,22,15,.55);display:grid;place-items:center;padding:16px}
.bgm[hidden]{display:none}
.bgbox{background:var(--card);border-radius:20px;width:min(1080px,100%);height:min(820px,calc(100dvh - 32px));display:flex;flex-direction:column;gap:8px;padding:12px 14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.bghead{display:flex;align-items:center;gap:10px}.bghead b{font-size:16px}.bghead .sp,.bgopts .sp{flex:1}
.xbtn{border:0;background:var(--soft2);width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer;color:var(--ink)}
.bgtools,.bgopts{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--soft2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;font-family:inherit;font-weight:800;font-size:13px;color:var(--muted);padding:7px 11px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
.seg button kbd{font:inherit;font-size:10.5px;opacity:.55;margin-left:4px}
.ibtn{border:1px solid var(--line);background:var(--card);font-family:inherit;font-weight:800;font-size:13px;color:var(--ink);min-width:34px;height:32px;padding:0 9px;border-radius:9px;cursor:pointer;white-space:nowrap}
.ibtn:disabled{opacity:.35;cursor:default}.ibtn:not(:disabled):hover{background:var(--soft2)}
.zoomg{display:inline-flex;align-items:center;gap:4px}.zoomg output{min-width:48px;text-align:center;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
.bgopts .tol{white-space:nowrap}.bgopts .tol input{width:110px}
.bgstage{position:relative;flex:1;min-height:0;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.bgstage canvas{position:absolute;left:0;top:0;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.12);cursor:crosshair}
.bgstage canvas.px{image-rendering:pixelated}
.bgstage.hand,.bgstage.hand canvas{cursor:grab}.bgstage.panning,.bgstage.panning canvas{cursor:grabbing}
.bgstage.brush canvas{cursor:none}
.ring{position:absolute;border:1.5px solid #fff;outline:1.5px solid rgba(0,0,0,.65);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
.ring.sq{border-radius:0}
.bgfoot{display:flex;align-items:center;gap:10px}.bghint{flex:1;margin:0;font-size:12.5px;color:var(--muted);min-width:0}
body.bgopen{overflow:hidden}
.bgopts [hidden]{display:none!important}
@media(max-width:700px){.bgm{padding:0}.bgbox{border-radius:0;height:100dvh;width:100%;padding:10px}.bgbox>*{min-width:0}.bgtools{gap:6px}.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.zoomg{width:100%}.zoomg output{flex:1}.bgopts{gap:6px 10px}.bgfoot .btn{flex:1;justify-content:center}.seg button{padding:7px 9px;font-size:12.5px}.seg button kbd{display:none}.bgopts .tol input{width:80px}.bghead .bgsw button{font-size:0;padding:4px;gap:0}.bgfoot{flex-wrap:wrap}.bghint{flex-basis:100%}.hidem{display:none}}
.tip.tipmine{display:none;margin-bottom:4px}body.inmine .tip.tipmine{display:block}.tip a{color:var(--accent-text,#b45309);font-weight:800}
.tip b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;z-index:70;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{font-size:12px;color:var(--muted);text-align:center;padding:10px 0 30px}
@media(max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}.side{min-width:0}
  .side{position:static;padding:0}
  .packs{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))!important}
  .side h2{display:none}
  .packs{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .pack .pv{grid-template-columns:repeat(4,1fr)}.pack .pv img:nth-child(n+5){display:none}
  .pack small{display:none}.peek{display:none!important}
}
@media(max-width:700px){.mbar{flex-wrap:nowrap;gap:10px;padding:7px 10px}.mbar .btn{flex:none;padding:8px 11px}.mbar .chk,.mbar .tol{white-space:nowrap;flex:none}.mbar .tol{flex:1;min-width:0}.mbar .tol input{flex:1;min-width:40px;max-width:160px;width:auto}.minepanel{grid-template-columns:minmax(0,1fr)}.bkcard{padding:6px 6px 6px 12px}.bkt{flex:1}.obtn{padding:7px 9px;font-size:12.5px}}
@media(max-width:430px){.mbar .lg{display:none}}
@media(max-width:560px){
  .packs h3.sec{display:none}.packs{display:flex!important;overflow-x:auto;gap:6px;padding:2px 2px 6px;scroll-snap-type:x proximity;scrollbar-width:none}
  .packs::-webkit-scrollbar{display:none}
  .pack{flex:0 0 108px;scroll-snap-align:start}
  .toolbar{position:fixed;left:10px;right:10px;bottom:10px;top:auto;z-index:50;margin:0;flex-wrap:nowrap;gap:6px;box-shadow:0 14px 30px -12px rgba(0,0,0,.45)}
  .toolbar .grp:first-child{flex:1}.toolbar .grp:first-child .btn{flex:1;justify-content:center;padding:9px 6px}
  .selinfo{display:none}.morebtn{display:inline-flex}

function posCtx(){const c=$('ctx');if(!sel.size||mode){c.hidden=true;return}const L=[...sel].map(k=>items[k]).filter(Boolean);if(!L.length){c.hidden=true;return}c.hidden=false;const x0=Math.min(...L.map(o=>o.x)),y0=Math.min(...L.map(o=>o.y)),x1=Math.max(...L.map(o=>o.x+o.w)),y1=Math.max(...L.map(o=>o.y+o.h));const W=board.clientWidth,cw=c.offsetWidth,ch=c.offsetHeight;c.style.left=Math.max(6,Math.min(W-cw-6,(x0+x1)/2-cw/2))+'px';c.style.top=(y0-ch-14>4?y0-ch-14:y1+14)+'px'}
function edHead(){const p=cur();$('edTitle').textContent=p?p.name:'';$('edCount').textContent=(p?p.items.length:0)+'개'}
function syncSel(){items.forEach((o,i)=>o.el.classList.toggle('sel',sel.has(i)));$('selInfo').textContent=sel.size?sel.size+'개 선택됨':(matchMedia('(pointer:coarse)').matches?'그림을 탭해 고르세요':'클릭하거나 빈 곳을 드래그해 고르세요');$('selInfo').classList.toggle('on',!!sel.size);posCtx();$('copyBtn').disabled=$('saveBtn').disabled=$('addMineBtn').disabled=$('delBtn').disabled=!sel.size;}
let mode=null,start=null,orig=null,moved=false,base=null,tapOff=-1;
board.addEventListener('pointerdown',e=>{
  if(e.target.closest('.ctx'))return;
  const hd=e.target.closest('.hd');if(hd){const el=hd.closest('.item');const i=items.findIndex(o=>o.el===el);if(!sel.has(i)){sel=new Set([i]);syncSel()}board.setPointerCapture(e.pointerId);const r0=board.getBoundingClientRect();start={x:e.clientX-r0.left,y:e.clientY-r0.top,h:hd.dataset.h,k:i};moved=false;mode='resize';orig=[...sel].map(k=>({k,x:items[k].x,y:items[k].y,w:items[k].w,h:items[k].h}));board.classList.add('busy');e.stopPropagation();return}
  const rect=board.getBoundingClientRect();const px=e.clientX-rect.left,py=e.clientY-rect.top;
  const el=e.target.closest('.item');start={x:px,y:py};moved=false;
  if(el){board.setPointerCapture(e.pointerId);const i=items.findIndex(o=>o.el===el);tapOff=(e.pointerType==='touch'&&sel.has(i))?i:-1;
    if(e.shiftKey||e.ctrlKey||e.metaKey||(e.pointerType==='touch'&&sel.size&&!sel.has(i))){sel.has(i)&&e.pointerType!=='touch'?sel.delete(i):sel.add(i)}else if(!sel.has(i)){sel.clear();sel.add(i)}
    syncSel();mode='move';orig=[...sel].map(k=>({k,x:items[k].x,y:items[k].y}));el.classList.add('dragging');
    const top=Math.max(...items.map(o=>+o.el.style.zIndex||0))+1;[...sel].forEach(k=>items[k].el.style.zIndex=top)}
  else if(e.pointerType==='touch'){if(!e.shiftKey){sel.clear();syncSel()}}
  else{board.setPointerCapture(e.pointerId);mode='marquee';base=(e.shiftKey||e.ctrlKey||e.metaKey)?new Set(sel):new Set();marq.style.cssText=`display:block;left:${px}px;top:${py}px;width:0;height:0`}
});
board.addEventListener('pointermove',e=>{if(!mode)return;const rect=board.getBoundingClientRect();const px=e.clientX-rect.left,py=e.clientY-rect.top;const dx=px-start.x,dy=py-start.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;
  if(mode==='resize'){const a=orig.find(o=>o.k===start.k);const sx=start.h.includes('e')?1:-1,sy=start.h.includes('s')?1:-1;const f=Math.min(4,Math.max(.25,1+((sx*dx)/a.w+(sy*dy)/a.h)/2));
    orig.forEach(o=>{const it=items[o.k];it.w=Math.round(o.w*f);it.h=Math.round(o.h*f);if(o.k===start.k){it.x=sx<0?o.x+o.w-it.w:o.x;it.y=sy<0?o.y+o.h-it.h:o.y}else{it.x=o.x+(o.w-it.w)/2;it.y=o.y+(o.h-it.h)/2}place(it)});return}
  if(mode==='move'){board.classList.add('busy');const W=board.clientWidth,H=board.clientHeight;orig.forEach(({k,x,y})=>{const o=items[k];o.x=Math.min(Math.max(-o.w*.5,x+dx),W-o.w*.5);o.y=Math.min(Math.max(-o.h*.5,y+dy),H-o.h*.5);place(o)})}
  else{const x=Math.min(px,start.x),y=Math.min(py,start.y),w=Math.abs(dx),h=Math.abs(dy);marq.style.left=x+'px';marq.style.top=y+'px';marq.style.width=w+'px';marq.style.height=h+'px';
    sel=new Set(base);items.forEach((o,i)=>{if(o.x<x+w&&o.x+o.w>x&&o.y<y+h&&o.y+o.h>y)sel.add(i)});syncSel()}});
function endPointer(){if(mode==='marquee'){marq.style.display='none';if(!moved&&!base.size){sel.clear();syncSel()}}if(mode==='move'&&!moved&&tapOff>=0){sel.delete(tapOff);syncSel()}tapOff=-1;items.forEach(o=>o.el.classList.remove('dragging'));const wasEdit=(mode==='move'||mode==='resize')&&moved;mode=null;board.classList.remove('busy');posCtx();if(wasEdit)savePos()}
board.addEventListener('pointerup',endPointer);board.addEventListener('pointercancel',endPointer);
const SCALE=2.6;
async function composeCanvas(idx){const list=idx.map(k=>items[k]);await Promise.all(list.map(o=>o.img.decode().catch(()=>{})));
  const minx=Math.min(...list.map(o=>o.x)),miny=Math.min(...list.map(o=>o.y)),maxx=Math.max(...list.map(o=>o.x+o.w)),maxy=Math.max(...list.map(o=>o.y+o.h));
  const c=document.createElement('canvas');c.width=Math.ceil((maxx-minx)*SCALE);c.height=Math.ceil((maxy-miny)*SCALE);const g=c.getContext('2d');g.imageSmoothingQuality='high';
  if($('whiteBg').checked){g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height)}
  [...idx].sort((a,b)=>(+items[a].el.style.zIndex||0)-(+items[b].el.style.zIndex||0)).forEach(k=>{const o=items[k];g.drawImage(o.img,(o.x-minx)*SCALE,(o.y-miny)*SCALE,o.w*SCALE,o.h*SCALE)});
  return c}
const toBlob=c=>new Promise(r=>c.toBlob(r,'image/png'));
async function copySel(){if(!sel.size)return;const idx=[...sel];
  try{if(!window.ClipboardItem||!navigator.clipboard?.write)throw 0;
    const c=await composeCanvas(idx);const png=await toBlob(c);
    // Office reads the HTML flavour and keeps PNG transparency; a bare image/png often lands as a bitmap with a black background
    const s=idx.length===1&&!$('whiteBg').checked?items[idx[0]].url:c.toDataURL('image/png');
    const html=new Blob([`<img src="${s}" width="${Math.round(c.width/SCALE*1.5)}" height="${Math.round(c.height/SCALE*1.5)}">`],{type:'text/html'});
    await navigator.clipboard.write([new ClipboardItem({'image/png':png,'text/html':html})]);
    toast(idx.length+'개 복사했어요 · PPT에서 Ctrl+V',2600)}
  catch{toast('복사가 안 되는 브라우저라 PNG로 저장했어요');saveSel()}}
async function saveSel(){if(!sel.size)return;const blob=await toBlob(await composeCanvas([...sel]));const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`쌤플레이-PPT치트키-${pack}-${sel.size}개.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('PNG로 저장했어요 · PPT [삽입 → 그림]')}
$('copyBtn').onclick=copySel;$('saveBtn').onclick=saveSel;
$('allBtn').onclick=()=>{sel=new Set(items.map((_,i)=>i));syncSel()};$('noneBtn').onclick=()=>{sel.clear();syncSel()};$('resetBtn').onclick=async()=>{if(pack==='mine'&&MINE.items.some(x=>x.pos)){MINE.items.forEach(x=>delete x.pos);try{await dbWrite(st=>MINE.items.forEach(x=>st.put(x)))}catch{}}layout()};
document.querySelectorAll('.bgsw:not(.bgsw2) button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.bgsw:not(.bgsw2) button').forEach(x=>x.classList.toggle('on',x===b));board.className='board bg-'+b.dataset.bg;try{localStorage.setItem('stkBg',b.dataset.bg)}catch{}});
$('whiteBg').onchange=()=>{try{localStorage.setItem('stkWhite',$('whiteBg').checked?'1':'0')}catch{}};
document.addEventListener('keydown',e=>{if(BG.open||e.target.matches('input,textarea'))return;const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='c'&&sel.size){e.preventDefault();copySel()}
  if(mod&&e.key.toLowerCase()==='a'){e.preventDefault();sel=new Set(items.map((_,i)=>i));syncSel()}
  if(e.key==='Escape'){sel.clear();syncSel();setMenu(false)}
  if(e.key==='Enter'&&e.target.classList.contains('item')){const i=items.findIndex(o=>o.el===e.target);sel=new Set([i]);syncSel();copySel()}});
try{const sp=localStorage.getItem('stkPack');if(PACKS.some(p=>p.key===sp))pack=sp;const bg=localStorage.getItem('stkBg');if(bg)document.querySelector(`.bgsw:not(.bgsw2) button[data-bg="${bg}"]`)?.click();$('whiteBg').checked=localStorage.getItem('stkWhite')==='1'}catch{}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!sel.size)layout()},200)});
$('ctx').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,L=[...sel];
  if(a==='copy')copySel();else if(a==='save')saveSel();else if(a==='mine')addToMine();else if(a==='del')delSel();else if(a==='ren')renameSel();else if(a==='bg')bgSel();
  else if(a==='front'||a==='back'){const z=k=>+items[k].el.style.zIndex||0;const ord=items.map((o,i)=>i).sort((x,y)=>z(x)-z(y)||x-y);const S=ord.filter(k=>sel.has(k)),R=ord.filter(k=>!sel.has(k));(a==='front'?[...R,...S]:[...S,...R]).forEach((k,i)=>items[k].el.style.zIndex=i+1);savePos()}
  else if(a==='fit'){L.forEach(k=>{const o=items[k];o.x+=(o.w-o.w0)/2;o.y+=(o.h-o.h0)/2;o.w=o.w0;o.h=o.h0;place(o)});posCtx();savePos()}});
document.addEventListener('keydown',e=>{if(BG.open||!sel.size||e.target.matches('input,textarea'))return;const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!d)return;e.preventDefault();const s=e.shiftKey?10:1;[...sel].forEach(k=>{const o=items[k];o.x+=d[0]*s;o.y+=d[1]*s;place(o)});posCtx();savePos()});
$('moreBtn').onclick=e=>{e.stopPropagation();const o=$('moreBox').classList.toggle('open');$('moreBtn').setAttribute('aria-expanded',o)};
document.addEventListener('click',e=>{if(!e.target.closest('#moreBox,#moreBtn'))$('moreBox').classList.remove('open')});
$('bgTol').oninput=()=>$('tolVal').textContent=$('bgTol').value;
const dz=$('dropZone');['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();dz.classList.add('drop')}}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,()=>dz.classList.remove('drop')));dz.addEventListener('drop',e=>{if(e.dataTransfer.files.length){e.preventDefault();addFiles(e.dataTransfer.files)}});
$('addMineBtn').onclick=addToMine;$('delBtn').onclick=delSel;$('exportBtn').onclick=exportMine;
$('fileIn').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('importIn').onchange=e=>{const f=e.target.files[0];if(f)importMine(f);e.target.value=''};
['dragenter','dragover'].forEach(ev=>board.addEventListener(ev,e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();board.classList.add('drop')}}));
['dragleave','drop'].forEach(ev=>board.addEventListener(ev,()=>board.classList.remove('drop')));
board.addEventListener('drop',e=>{if(e.dataTransfer.files.length){e.preventDefault();addFiles(e.dataTransfer.files)}});
document.addEventListener('paste',e=>{if(BG.open||e.target.matches('input,textarea'))return;const fs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));if(fs.length){e.preventDefault();addFiles(fs)}});
document.addEventListener('keydown',e=>{if(!BG.open&&e.key==='Delete'&&pack==='mine'&&sel.size&&!e.target.matches('input,textarea'))delSel()});
